<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1023"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/><stop offset="0.5" stop-color="#4f46e5" stop-opacity="0.18"/><stop offset="1" stop-color="#0f172a" stop-opacity="0"/></radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#1e1b4b" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <!-- logo and name -->
  <g transform="translate(84 92)">
    <g transform="scale(1.6)">
      <polygon points="17,2 63,2 51,14 5,14" fill="url(#brand)"/>
      <polygon points="11,18 47,18 35,30 -1,30" fill="url(#brand)" opacity=".9"/>
      <polygon points="17,34 63,34 51,46 5,46" fill="url(#brand)"/>
    </g>
    <text x="124" y="34" fill="#fff" font-size="34" font-weight="800" letter-spacing="-0.5">Efficiency</text>
    <text x="124" y="72" fill="#fff" font-size="34" font-weight="800" letter-spacing="-0.5">Finder</text>
  </g>
  <text x="84" y="268" fill="#fff" font-size="58" font-weight="800" letter-spacing="-1.5">Find the hours</text>
  <text x="84" y="334" fill="#fff" font-size="58" font-weight="800" letter-spacing="-1.5">hiding in a work week.</text>
  <text x="84" y="392" fill="#a5b4fc" font-size="24" font-weight="500">The model proposes. Code decides.</text>

  <!-- report card -->
  <g filter="url(#sh)" transform="rotate(-2 860 520)">
    <rect x="610" y="420" width="510" height="250" rx="22" fill="#fff"/>
    <rect x="636" y="446" width="64" height="26" rx="13" fill="#fef3c7"/>
    <text x="668" y="464" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">Sample</text>
    <rect x="636" y="492" width="44" height="44" rx="12" fill="url(#brand)"/>
    <text x="658" y="522" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">1</text>
    <text x="696" y="510" fill="#0f172a" font-size="20" font-weight="700">Weekly sales report</text>
    <text x="696" y="534" fill="#64748b" font-size="15">Assembling a recurring report</text>
    <text x="1094" y="522" fill="#4f46e5" font-size="26" font-weight="800" text-anchor="end">0.6–2.4 h</text>
    <rect x="636" y="560" width="458" height="44" rx="10" fill="#f8fafc" stroke="#c7d2fe" stroke-dasharray="5 4"/>
    <text x="654" y="588" fill="#334155" font-size="16">1 h  ×  2–4 / wk  ×  30–60%  =</text>
    <text x="1078" y="588" fill="#4f46e5" font-size="16" font-weight="800" text-anchor="end">0.6–2.4 h</text>
    <g fill="#059669">
      <circle cx="648" cy="636" r="9" fill="#ecfdf5"/><circle cx="672" cy="636" r="9" fill="#ecfdf5"/><circle cx="696" cy="636" r="9" fill="#ecfdf5"/><circle cx="720" cy="636" r="9" fill="#ecfdf5"/><circle cx="744" cy="636" r="9" fill="#ecfdf5"/><circle cx="768" cy="636" r="9" fill="#ecfdf5"/><circle cx="792" cy="636" r="9" fill="#ecfdf5"/>
    </g>
    <g stroke="#059669" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M644 636l3 3 5-6M668 636l3 3 5-6M692 636l3 3 5-6M716 636l3 3 5-6M740 636l3 3 5-6M764 636l3 3 5-6M788 636l3 3 5-6"/>
    </g>
    <text x="810" y="641" fill="#64748b" font-size="15">Reviewer: 7 of 7 rules passed</text>
  </g>

  <!-- coverage ring -->
  <g filter="url(#sh)">
    <rect x="84" y="470" width="420" height="190" rx="22" fill="#fff"/>
    <circle cx="180" cy="565" r="58" fill="none" stroke="#e0e7ff" stroke-width="14"/>
    <circle cx="180" cy="565" r="58" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="237 365" transform="rotate(-90 180 565)"/>
    <text x="180" y="574" fill="#0f172a" font-size="26" font-weight="800" text-anchor="middle">65%</text>
    <text x="484" y="498" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="end">Illustration</text>
    <text x="262" y="552" fill="#0f172a" font-size="20" font-weight="700">of the week mapped</text>
    <text x="262" y="582" fill="#64748b" font-size="16">Tasks you confirmed,</text>
    <text x="262" y="604" fill="#64748b" font-size="16">hours computed in code</text>
  </g>
</svg>
