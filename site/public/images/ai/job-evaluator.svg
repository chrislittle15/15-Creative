<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="'Plus Jakarta Sans', Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1524"/><stop offset="1" stop-color="#101C2D"/></linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.65"><stop offset="0" stop-color="#35C5B0" stop-opacity="0.38"/><stop offset="0.55" stop-color="#3978F6" stop-opacity="0.12"/><stop offset="1" stop-color="#101C2D" stop-opacity="0"/></radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35C5B0"/><stop offset="1" stop-color="#1E9FC4"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#35C5B0"/><stop offset="1" stop-color="#3978F6"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>

  <g transform="translate(84 86)">
    <g transform="scale(1.1)">
      <rect width="64" height="64" rx="16" fill="url(#mark)"/>
      <path d="M19 13h17l9 9v26a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M36 13v9h9" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <path d="M23 29h12M23 35h8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <path d="M29 43l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="92" y="36" fill="#fff" font-size="34" font-weight="800" letter-spacing="-0.5">Job Evaluator</text>
    <text x="92" y="62" fill="#35C5B0" font-size="14" font-weight="700" letter-spacing="4">CAREER INTELLIGENCE</text>
  </g>

  <text x="84" y="262" fill="#fff" font-size="60" font-weight="800" letter-spacing="-1.5">Know the opportunity</text>
  <text x="84" y="330" fill="#35C5B0" font-size="60" font-weight="800" letter-spacing="-1.5">before you pursue it.</text>
  <text x="84" y="386" fill="#9FB3C8" font-size="23" font-weight="500">Four stages. Research, fit, pay, verdict.</text>

  <g font-size="15" font-weight="700">
    <g transform="translate(84 430)">
      <rect width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#35C5B0" stroke-opacity="0.55"/>
      <text x="85" y="25" fill="#E8EEF6" text-anchor="middle">1 &#183; Research</text>
    </g>
    <g transform="translate(266 430)">
      <rect width="140" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#35C5B0" stroke-opacity="0.55"/>
      <text x="70" y="25" fill="#E8EEF6" text-anchor="middle">2 &#183; Fit</text>
    </g>
    <g transform="translate(418 430)">
      <rect width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.08" stroke="#35C5B0" stroke-opacity="0.55"/>
      <text x="80" y="25" fill="#E8EEF6" text-anchor="middle">3 &#183; Pay</text>
    </g>
    <g transform="translate(590 430)">
      <rect width="180" height="38" rx="19" fill="#35C5B0"/>
      <text x="90" y="25" fill="#101C2D" text-anchor="middle">4 &#183; Verdict</text>
    </g>
  </g>

  <g filter="url(#sh)" transform="rotate(-2 880 560)">
    <rect x="640" y="500" width="470" height="190" rx="22" fill="#fff"/>
    <g transform="translate(668 524)">
      <circle cx="52" cy="52" r="44" fill="none" stroke="#E3E8EF" stroke-width="10"/>
      <circle cx="52" cy="52" r="44" fill="none" stroke="url(#ring)" stroke-width="10" stroke-linecap="round" stroke-dasharray="193.5 276.5" transform="rotate(-90 52 52)"/>
      <text x="52" y="61" text-anchor="middle" font-weight="800" font-size="28" fill="#101C2D">7<tspan font-size="13" font-weight="600" fill="#5B6B80">/10</tspan></text>
    </g>
    <text x="796" y="552" fill="#101C2D" font-size="21" font-weight="800">Operations Manager</text>
    <text x="796" y="578" fill="#5B6B80" font-size="15" font-weight="500">Fictional sample company</text>
    <rect x="796" y="596" width="118" height="30" rx="15" fill="#E3F4F1"/>
    <text x="855" y="616" fill="#0E8F7E" font-size="13" font-weight="800" text-anchor="middle">Good Match</text>
    <rect x="926" y="596" width="82" height="30" rx="15" fill="#101C2D"/>
    <text x="967" y="616" fill="#35C5B0" font-size="13" font-weight="800" text-anchor="middle">PURSUE</text>
    <text x="668" y="668" fill="#8896A8" font-size="13" font-weight="600">Illustration, not a real evaluation</text>
  </g>
</svg>
